name: Build Windows Latest

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/windows-latest.yml'

permissions:
  contents: read

concurrency:
  group: windows-latest-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build Windows x64 EXE
    runs-on: windows-2022
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
          package-manager-cache: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.12.3
          run_install: false

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Show tool versions
        shell: pwsh
        run: |
          node --version
          pnpm --version
          rustc --version
          cargo --version

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build latest Windows executable
        shell: pwsh
        env:
          CI: 'true'
        run: |
          $ErrorActionPreference = 'Stop'
          pnpm tauri build --no-bundle

      - name: Prepare artifact
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $exe = 'src-tauri/target/release/cc-switch.exe'
          if (-not (Test-Path -LiteralPath $exe -PathType Leaf)) {
            throw "Executable not found: $exe"
          }

          $shortSha = $env:GITHUB_SHA.Substring(0, 8)
          $out = Join-Path $env:GITHUB_WORKSPACE 'windows-latest-artifact'
          New-Item -ItemType Directory -Force -Path $out | Out-Null
          Copy-Item -LiteralPath $exe -Destination (Join-Path $out 'cc-switch.exe')

          @(
            "repository=$env:GITHUB_REPOSITORY",
            "commit=$env:GITHUB_SHA",
            "short_commit=$shortSha",
            "ref=$env:GITHUB_REF",
            "built_at_utc=$([DateTime]::UtcNow.ToString('o'))"
          ) | Set-Content -LiteralPath (Join-Path $out 'build-info.txt') -Encoding UTF8

          Get-FileHash -Algorithm SHA256 -LiteralPath (Join-Path $out 'cc-switch.exe') |
            ForEach-Object { $_.Hash.ToLowerInvariant() + '  cc-switch.exe' } |
            Set-Content -LiteralPath (Join-Path $out 'SHA256SUMS.txt') -Encoding ascii

      - name: Upload Windows EXE
        uses: actions/upload-artifact@v7
        with:
          name: CC-Switch-main-${{ github.sha }}-Windows-x64
          path: windows-latest-artifact/
          if-no-files-found: error
          retention-days: 30
